<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container">

        <h2 class="text-center my-5">Student Management</h2>


        <!-- Search + Add Student -->
        <div class="d-flex align-items-center justify-content-between mb-4">

            <div class="d-flex gap-2" style="width: 500px;">

                <input
                    type="text"
                    id="search"
                    class="form-control"
                    placeholder="Search student">

                <button
                    onclick="searchStudent()"
                    class="btn btn-success">
                    Search
                </button>

            </div>


            <button
                data-bs-toggle="modal"
                data-bs-target="#studentModal"
                onclick="openAddModal()"
                class="btn btn-success">

                Add Student

            </button>

        </div>


        <!-- Student Table -->
        <table class="table table-bordered table-hover">

            <thead>

                <tr class="text-center">

                    <th>ID</th>

                    <th>Name</th>

                    <th>Student Code</th>

                    <th>Gender</th>

                    <th>Major</th>

                    <th>GPA</th>

                    <th>Image</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="show-students">

            </tbody>

        </table>

    </div>



    <!-- Student Modal -->

    <div
        class="modal fade"
        id="studentModal"
        tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">


                <!-- Modal Header -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modalTitle">

                        Add Student

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>



                <!-- Modal Body -->

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="studentId">


                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Student Code
                        </label>

                        <input
                            type="text"
                            id="studentCode"
                            class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            id="gender"
                            class="form-select">

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Class
                        </label>

                        <input
                            type="text"
                            id="className"
                            class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Major
                        </label>

                        <input
                            type="text"
                            id="major"
                            class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            GPA
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            id="gpa"
                            class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Image URL
                        </label>

                        <input
                            type="text"
                            id="image"
                            class="form-control">

                    </div>

                </div>



                <!-- Modal Footer -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>


                    <button
                        type="button"
                        onclick="saveStudent()"
                        class="btn btn-success">

                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- JavaScript -->

    <script src="07,10.js"></script>

</body>

</html>
